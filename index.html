<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172039">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Graph Calc">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/mathlive-static.css">
<link rel="stylesheet" href="app.css">
<link rel="modulepreload" href="vendor/mathlive.min.mjs">
<title>Graph Calc</title>
</head>
<body class="home">
<div class="device">
  <header class="masthead">
    <div class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Graph Calc</div>
    <div class="mast-status" id="connection" hidden>Offline</div>
  </header>
  <div class="screen">
    <header class="display-head">
      <h1 id="title">Home</h1>
      <div id="status" class="status" aria-live="polite"></div>
    </header>
    <main id="view" aria-labelledby="title"></main>
    <nav id="displayTabs" class="display-tabs" aria-label="Calculator screens" hidden></nav>
    <div id="scrim" class="scrim"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert></section>
  </div>
  <section class="deck" aria-label="Calculator controls">
    <div id="controls" class="controls"></div>
    <div id="keypad" class="keypad"></div>
  </section>
</div>
<script src="vendor/math.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
